[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Recipe Database API"
readme = "README.md"
authors = ["Jessica Johnson <jessica.johnson@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.109.2"
sqlalchemy = {extras = ["mypy"], version = "^2.0.37"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
python-dotenv = "^1.0.0"
structlog = "^24.1.0"
tenacity = "^8.2.3"
cachetools = "^5.3.2"
fuzzywuzzy = "^0.18.0"
python-Levenshtein = "^0.23.0"
spoonacular = "^3.0"
redis = "^4.6.0"
uvicorn = "^0.27.1"
email-validator = "^2.1.0"
httpx = "^0.26.0"
python-multipart = "^0.0.18"
pyjwt = "^2.8.0"
psycopg2-binary = "^2.9.9"
aiohttp = "^3.12.14"
fastapi-cache2 = {extras = ["redis"], version = "^0.2.2"}
pydantic = {extras = ["email"], version = "^2.6.1"}
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cython = "^3.0.11"
databases = "^0.9.0"
werkzeug = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
coverage = {extras = ["toml"], version = "^7.4.1"}
ruff = "^0.3.3"
types-redis = "^4.6.0.20240106"
types-passlib = "^1.7.7.20240106"
types-python-jose = "^3.3.4.20240106"
types-aiofiles = "^23.2.0.20240106"
types-pytz = "^2024.1.0.20240203"
types-cachetools = "^5.5.0.20240820"
# Documentation dependencies
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"  # ReadTheDocs theme
sphinx-autodoc-typehints = "^2.0.0"  # Type hints support
sphinx-copybutton = "^0.5.2"  # Copy button for code blocks
sphinx-design = "^0.5.0"  # UI components
sphinx-inline-tabs = "^2023.4.21"  # Tabbed content
sphinx-autoapi = "^3.0.0"  # API documentation
sphinxcontrib-mermaid = "^0.9.2"  # Mermaid diagrams
sphinxcontrib-httpdomain = "^1.8.1"  # HTTP API documentation
sphinxcontrib-openapi = "^0.8.3"  # OpenAPI/Swagger documentation
sphinx-autobuild = "^2024.2.4"  # Live reload server
sphinx-toolbox = "^3.8.1"  # Various utilities
sphinx-book-theme = "^1.1.3"  # Book theme
sphinx-material = "^0.0.36"  # Material theme
sphinx-gallery = "^0.18.0"  # Code examples gallery
sphinx-markdown-builder = "^0.6.8"  # Markdown output
sphinx-hoverxref = "^1.4.2"  # Tooltips on references
sphinx-multiversion = "^0.2.4"  # Multiple doc versions

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    "alembic",
    "tests",
    "test_*.py",
]
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D211",
    "D213",
    "D100",
    "ANN101",
    "ANN102",
    "PLR0913",
    "B008",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["app"]
required-imports = ["from __future__ import annotations"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
split-on-trailing-comma = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = [
    "D",
    "E",
    "F",
    "I",
    "N",
    "ANN",
    "TCH",
]
"alembic/*" = [
    "D",
    "E",
    "F",
    "I",
    "N",
    "ANN",
    "TCH",
]
"__init__.py" = ["D104"]
"app/api/routes/*" = ["B008"]
"app/models/*" = ["N805"]
"app/schemas/*" = ["N805"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --cov-branch"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/__init__.py",
    "*/scripts/*",
    "*/types/*",
]
dynamic_context = "test_function"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "@abstractmethod",
    "@abc.abstractmethod",
]
ignore_errors = true
fail_under = 80
precision = 2
show_missing = true

[tool.coverage.html]
directory = "coverage_html"
show_contexts = true
title = "RecipeDB Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"
