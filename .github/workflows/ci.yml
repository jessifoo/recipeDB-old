name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '28 6 * * 5'
    - cron: '37 0 * * 4'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@c21c6cd3fd3c977e79c75d6797088fc241974589
        with:
          fetch-depth: 1
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@d8a3a6c8a4c1b2f3e5f6a9c7b8d9e0f1a2b3c4d5
        with:
          sarif_file: semgrep.sarif
        if: always()

  black:
    name: Python Black Formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c21c6cd3fd3c977e79c75d6797088fc241974589
        with:
          fetch-depth: 1
      - name: Run python black code formatter
        uses: psf/black@23.9b0
        with:
          options: "--check --diff"

  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c21c6cd3fd3c977e79c75d6797088fc241974589
        with:
          fetch-depth: 1
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@d8a3a6c8a4c1b2f3e5f6a9c7b8d9e0f1a2b3c4d5
        with:
          sarif_file: results.sarif

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: [semgrep, black, codacy-security-scan]
    env:
      POETRY_VERSION: "1.7.1"
    strategy:
      matrix:
        python-version: ["3.11"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@c21c6cd3fd3c977e79c75d6797088fc241974589
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8g9h0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry self update
      - name: Cache Poetry dependencies
        uses: actions/cache@b1c2d3e4f5a6b7c8d9e0a1b2c3d4e5f6a7b8c9d0
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Verify Poetry Lock
        run: cd backend && poetry lock --check
      - name: Install dependencies
        run: cd backend && poetry install --no-interaction --sync
      - name: Run tests with coverage
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
      - name: Run OWASP ZAP Security Scan (Optional)
        if: ${{ env.ENABLE_ZAP == 'true' || false }}
        uses: zaproxy/action-full-scan@v0.6.0
        with:
          target: 'http://localhost:8000'
      - name: Run Trivy Security Scan
        if: ${{ env.ENABLE_TRIVY == 'true' || false }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          exit-code: '1'
          ignore-unfixed: true
